# Publica el admin y los espacios de cliente en Cloudflare Pages cada vez que se sube algo a main.
#
# Necesita, en GitHub → Settings → Secrets and variables → Actions (lo deja hecho "python backoffice.py cloudflare"):
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: ACCESS_TEAM, ACCESS_AUD, ADMIN_EMAIL (y PROYECTO si no se llama freelance-backoffice)
# Ver docs/instalar.md. Sin datos/negocio.json (la plantilla recién creada), solo pasa los tests.
#
# No hace falta tocar este archivo: "python backoffice.py actualizar" lo pone al día.

name: Publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

env:
  PROYECTO: ${{ vars.PROYECTO || 'freelance-backoffice' }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # para comparar las facturas con el commit anterior

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: ¿Hay datos?
        id: datos
        run: |
          if [ -f datos/negocio.json ]; then echo "hay=1" >> "$GITHUB_OUTPUT"; else echo "Aún no hay datos/negocio.json: no se publica nada."; fi

      # Además de que los datos cuadren, comprueba que ninguna factura emitida ha cambiado en este push.
      - name: Revisar los datos
        if: steps.datos.outputs.hay == '1'
        run: python backoffice.py revisar --desde "${{ github.event.before || github.event.pull_request.base.sha || 'HEAD~1' }}"

      # Las facturas llevan su PDF en el repo; aquí no se genera ninguno.
      - name: Montar el sitio
        if: steps.datos.outputs.hay == '1'
        run: python backoffice.py build

      - name: Configuración de Access
        if: steps.datos.outputs.hay == '1' && github.event_name != 'pull_request'
        env:
          ACCESS_TEAM: ${{ vars.ACCESS_TEAM }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          DEMO: ${{ vars.DEMO }}
        run: python backoffice.py wrangler

      # La primera vez crea el proyecto de Pages; las demás falla porque ya existe, y da igual.
      - name: Crear el proyecto de Pages
        if: steps.datos.outputs.hay == '1' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.0'
          command: pages project create ${{ env.PROYECTO }} --production-branch=main

      - name: Desplegar
        if: steps.datos.outputs.hay == '1' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3.114.0'
          command: pages deploy --project-name=${{ env.PROYECTO }} --branch=main --commit-hash=${{ github.sha }}
