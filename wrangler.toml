# Cloudflare Pages: un solo proyecto con el admin (/admin/, detrás de Cloudflare Access)
# y los espacios de cliente (/c/<slug>/, con enlace personal). Lo despliega .github/workflows/publicar.yml.
name = "freelance-backoffice"
pages_build_output_dir = "dist/sitio"
compatibility_date = "2026-11-01"

# No las rellenes aquí: ponlas en GitHub → Settings → Secrets and variables → Actions → Variables
# (o deja que lo haga python backoffice.py cloudflare). El workflow las escribe aquí al publicar.
# Mientras falten, /admin/ responde 403 a todo (cerrado, nunca abierto).
[vars]
ACCESS_TEAM = ""   # el subdominio de tu equipo de Zero Trust: <ACCESS_TEAM>.cloudflareaccess.com
ACCESS_AUD = ""    # Access → Applications → Freelance Backoffice → Overview → Application Audience (AUD) Tag
ADMIN_EMAIL = ""   # el email con el que entras (o varios, separados por comas)
DEMO = ""          # "1" solo para la demo pública: deja /admin/ abierto si los datos son los de demo/
